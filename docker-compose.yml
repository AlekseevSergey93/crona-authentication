services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/auth
      DATABASE_USERNAME: ${DATABASE_USERNAME:-auth}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_ISSUER: ${JWT_ISSUER:-crona-authentication}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-PT15M}
      SESSION_TTL: ${SESSION_TTL:-PT24H}
      LIQUIBASE_ENABLED: ${LIQUIBASE_ENABLED:-true}
    secrets:
      - jwt_private
      - jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: ${DATABASE_USERNAME:-auth}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8088}:8088"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8088/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:

secrets:
  jwt_private:
    file: ${JWT_PRIVATE_KEY_FILE:-./secrets/jwt-private.pem}
  jwt_public:
    file: ${JWT_PUBLIC_KEY_FILE:-./secrets/jwt-public.pem}
